name: Cypress API Tests

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  cypress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check credentials
        env:
          CYPRESS_API_USERNAME: ${{ secrets.API_USERNAME }}
          CYPRESS_API_PASSWORD: ${{ secrets.API_PASSWORD }}
          CYPRESS_INVALID_PASSWORD: ${{ secrets.INVALID_PASSWORD }}
        run: |
          if [ -z "$CYPRESS_API_USERNAME" ]; then
            echo "API_USERNAME is missing"
            exit 1
          fi

          if [ -z "$CYPRESS_API_PASSWORD" ]; then
            echo "API_PASSWORD is missing"
            exit 1
          fi

          echo "Cypress credentials are configured"

      - name: Run Cypress tests
        env:
          CYPRESS_API_USERNAME: ${{ secrets.API_USERNAME }}
          CYPRESS_API_PASSWORD: ${{ secrets.API_PASSWORD }}
          CYPRESS_INVALID_PASSWORD: ${{ secrets.INVALID_PASSWORD }}
        run: npx cypress run --browser chrome

      - name: Generate Mochawesome report
        if: always()
        run: |
          npm run report:merge
          npm run report:generate

      - name: Upload Mochawesome report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-mochawesome-report
          path: cypress/reports/